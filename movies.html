<script>

    const TMDB_KEY = "032c4a509e1af3345711db83117b2dab";
    const CSV_PATH = "watched.csv";
    const TMDB_IMG = "https://image.tmdb.org/t/p/w92";
    const CONCURRENCY = 8;

    let movieData = [];

    window.addEventListener("DOMContentLoaded", async () => {
        await loadCSV();
    });

    async function loadCSV() {
        try {
            const res = await fetch(CSV_PATH);
            if (!res.ok) throw new Error("Could not load watched.csv");

            const text = await res.text();

            const results = Papa.parse(text, {
                header: true,
                skipEmptyLines: true
            });

            movieData = results.data.map(row => ({
                title: row.Name || row.Title || "Unknown",
                year: parseInt(row.Year) || 0,
                dateWatched: row.Date || row["Watched Date"] || "",
                url: row["Letterboxd URI"] || "#",
                posterPath: null
            }));

            document.getElementById("status").textContent =
                movieData.length + " films loaded";

            await fetchPosters(movieData);

        } catch (err) {
            document.getElementById("status").textContent =
                "Failed to load watched.csv";
            console.error(err);
        }
    }


    async function fetchPosters(movies) {
        const prog = document.getElementById("progress");
        prog.style.display = "block";

        let done = 0;
        const total = movies.length;

        for (let i = 0; i < movies.length; i += CONCURRENCY) {
            const batch = movies.slice(i, i + CONCURRENCY);

            await Promise.all(batch.map(async (m) => {
                m.posterPath = await lookupPoster(m.title, m.year);
                done++;
                prog.textContent = `${done} / ${total}`;
            }));

            render(movies);
        }

        prog.style.display = "none";
        render(movies);
    }

    async function lookupPoster(title, year) {
        try {
            const q = encodeURIComponent(title);

            let url = `https://api.themoviedb.org/3/search/movie?api_key=${TMDB_KEY}&query=${q}&language=en-US&page=1`;

            if (year) {
                const r = await fetch(url + `&year=${year}`);
                const d = await r.json();
                if (d.results?.[0]?.poster_path) return d.results[0].poster_path;
            }

            const r2 = await fetch(url);
            const d2 = await r2.json();

            return d2.results?.[0]?.poster_path || null;
        } catch {
            return null;
        }
    }


    function render(movies) {
        const byYear = {};

        for (const m of movies) {
            const y = m.year || "?";
            if (!byYear[y]) byYear[y] = [];
            byYear[y].push(m);
        }

        const years = Object.keys(byYear).sort((a, b) => b - a);

        const journal = document.getElementById("journal");
        journal.innerHTML = "";

        for (const year of years) {
            const row = document.createElement("div");
            row.className = "year-row";

            const label = document.createElement("div");
            label.className = "year-label";
            label.textContent = year;

            const posters = document.createElement("div");
            posters.className = "posters";

            for (const m of byYear[year]) {
                if (m.posterPath) {
                    const a = document.createElement("a");
                    a.href = m.url;
                    a.target = "_blank";
                    a.title = m.title;

                    const img = document.createElement("img");
                    img.src = TMDB_IMG + m.posterPath;
                    img.alt = m.title;
                    img.loading = "lazy";

                    img.onerror = function () {
                        this.parentElement.replaceWith(makePlaceholder());
                    };

                    a.appendChild(img);
                    posters.appendChild(a);
                } else {
                    posters.appendChild(makePlaceholder());
                }
            }

            row.appendChild(label);
            row.appendChild(posters);
            journal.appendChild(row);
        }
    }

    function makePlaceholder() {
        const d = document.createElement("div");
        d.className = "poster-placeholder";
        return d;
    }
</script>
